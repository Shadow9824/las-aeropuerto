.hidden{display:none!important}
.staticrypt-spinner-container{display:grid;place-items:center;height:100%}

.card{position:relative;width:100%;max-width:380px;text-align:center}

.core .eye i{width:18px;height:3.5px;border-radius:4px;background:#5fd2ff;box-shadow:0 0 10px #00b4ff;margin:0 3px;display:inline-block;animation:glow 4s ease-in-out infinite}
.core .pulse{position:absolute;inset:26px;border-radius:50%;border:1.5px solid rgba(0,180,255,.5);animation:pulse 3.6s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.9);opacity:0}15%{opacity:.7}100%{transform:scale(1.4);opacity:0}}
