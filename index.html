<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>LAS · Llegadas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1220" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LAS Llegadas" />
<meta http-equiv="cache-control" content="no-cache" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Barlow,Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:#f2f5fa;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#0d1828 0,#0a1220 320px);background-color:#0a1220;
  display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:14px;padding:0 2px 16px}
.brand-ico{flex:none;width:54px;height:54px;border-radius:8px;background:#ffd200;display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.brand-ico svg{width:34px;height:34px;fill:#0b0b0b}
.brand b{display:block;font-family:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:34px;line-height:.95;letter-spacing:.04em;text-transform:uppercase}
.brand em{display:block;font-style:normal;font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#7d8ba3;margin-top:4px}
.box{border:1px solid #1d2b44;border-radius:10px;background:#0f1a2c;overflow:hidden;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:#132137;border-bottom:1px solid #1d2b44;
  font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.box-h span{display:flex;align-items:center;gap:9px}
.box-h span::before{content:"";width:4px;height:16px;border-radius:1px;background:#ffb400}
.box-h small{font-size:13px;font-weight:600;letter-spacing:.12em;color:#7d8ba3}
.box-b{padding:16px 14px}
.box-b p{font-size:15px;color:#b3bfd2;line-height:1.45;margin-bottom:14px}
.foot{margin-top:16px;font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#55647c;display:flex;gap:7px;justify-content:center;align-items:center}
.foot svg{width:14px;height:14px}
.live{display:inline-flex;align-items:center;gap:6px;color:#2fd27a}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blip 2.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.th{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:0 14px;height:28px;align-items:center;background:#0c1627;border-bottom:1px solid #1d2b44;
  font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#55647c}
.user{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:#f2f5fa;border-bottom:1px solid rgba(29,43,68,.7);background:#111d31;transition:background .2s;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.user:nth-child(odd){background:#0e192b}
.user + .user{animation-delay:.08s}
.user:last-child{border-bottom:0}
.user:hover,.user:focus-visible{background:#162741;outline:none}
.user:active{background:#1a2d4a}
.gate{width:44px;height:44px;border-radius:7px;display:grid;place-items:center;font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:24px}
.jorge .gate{background:#ffb400;color:#111}
.eriel .gate{background:#0a1322;color:#ffd060;border:1px solid #2a3b58}
.user b{display:block;font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:24px;letter-spacing:.1em;line-height:1}
.user small{display:block;margin-top:3px;font-size:12.5px;color:#7d8ba3}
.go{font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:14px;letter-spacing:.12em;color:#2fd27a;display:flex;align-items:center;gap:6px}
.go svg{width:18px;height:18px;transition:transform .2s}
.user:hover .go svg{transform:translateX(3px)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="brand-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 19h19v2h-19v-2zm7.18-5.73 4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-5.31-1.42-2.76-9.02L10.12 2v8.28L5.15 8.95l-.93-2.32-1.45-.39v5.17l1.6.43 5.31 1.43z"/></svg></span>
    <span><b>Llegadas</b><em>Arrivals · LAS · Las Vegas</em></span>
  </div>
  <div class="box">
    <div class="box-h"><span>Elige tu acceso</span><small class="live"><i></i>Abierto</small></div>
    <div class="th"><span>Acceso</span><span>Usuario</span><span>Estado</span></div>
    <a class="user jorge" href="jorge.html">
      <span class="gate">J</span>
      <span><b>JORGE</b><small>Contraseña propia</small></span>
      <span class="go">ENTRAR <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="user eriel" href="eriel.html">
      <span class="gate">E</span>
      <span><b>ERIEL</b><small>Contraseña propia</small></span>
      <span class="go">ENTRAR <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
  </div>
  <div class="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg> Cifrado AES-256 · se descifra en tu teléfono</div>
</div>
</body>
</html>
